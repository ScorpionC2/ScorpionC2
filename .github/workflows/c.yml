name: C Actions

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main", "dev"]

jobs:
  build-test:
    runs-on: ubuntu-24.04

    strategy:
      fail-fast: false
      matrix:
        compiler: [gcc]

    name: Build & Test (${{ matrix.compiler }})

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            clang \
            nasm \
            valgrind

      - name: Build
        run: make CC=${{ matrix.compiler }} build

      - name: Run tests
        run: make CC=${{ matrix.compiler }} test

      - name: Valgrind check
        run: |
          make CC=${{ matrix.compiler }} run-valgrind \
            OPT_FLAGS="-march=x86-64-v3"
